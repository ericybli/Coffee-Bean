name: CoffeeBean
options:
  bundleIdPrefix: com.month2month
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  CoffeeBeanCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Automatic signing for device runs. Select your (personal) team once in
    # Xcode > Signing & Capabilities, or set DEVELOPMENT_TEAM here to persist it:
    # DEVELOPMENT_TEAM: "ABCDE12345"
    CODE_SIGN_STYLE: Automatic
    # Simulator-only builds from the CLI still pass CODE_SIGNING_ALLOWED=NO explicitly.
targets:
  CoffeeBean:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CoffeeBean
    dependencies:
      - package: CoffeeBeanCore
        product: CoffeeBeanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericybli.coffeebean
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Coffee Bean reads your active energy and body metrics to estimate your energy balance."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Coffee Bean saves your meals, water, weight, and body composition to Apple Health."
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan product barcodes to look up nutrition."
schemes:
  CoffeeBean:
    build:
      targets:
        CoffeeBean: all
    run:
      config: Debug
    test:
      config: Debug
